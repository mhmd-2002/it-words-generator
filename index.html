<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد أكود مصطلحات تقنية المعلومات بالذكاء الاصطناعي</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--primary-color);
            margin-top: 0;
            text-align: center;
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input, select, button {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
        }

        input[type="text"], input[type="password"] {
            flex: 1;
            min-width: 200px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .search-box {
            width: 100%;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8fafc;
            color: #64748b;
        }

        .code-badge {
            background-color: #eff6ff;
            color: var(--primary-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-weight: bold;
            font-size: 13px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
            color: var(--primary-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>نظام مولد أكود مصطلحات IT</h1>
    
    <div class="control-panel">
        <div class="input-group">
            <input type="password" id="apiKey" placeholder="أدخل مفتاح Gemini API Key هنا...">
            <select id="categorySelect">
                <option value="الكل">جميع المجالات التقنية</option>
                <option value="الأمن السيبراني">الأمن السيبراني</option>
                <option value="تطوير البرمجيات">تطوير البرمجيات</option>
                <option value="الشبكات">الشبكات</option>
                <option value="قواعد البيانات">قواعد البيانات</option>
                <option value="الذكاء الاصطناعي">الذكاء الاصطناعي</option>
            </select>
            <button id="generateBtn" onclick="generateTerms()">توليد الأكواد والمصطلحات</button>
        </div>

        <input type="text" id="searchInput" class="search-box" placeholder="تصفية بالأكواد أو الكلمات..." onkeyup="filterTable()">
    </div>

    <div id="loading" class="loading">جاري التوليد باستخدام الذكاء الاصطناعي... يرجى الانتظار</div>

    <table id="termsTable">
        <thead>
            <tr>
                <th>كود المصطلح (ID)</th>
                <th>المصطلح بالعربية</th>
                <th>المصطلح بالإنجليزي</th>
                <th>التصنيف</th>
                <th>الوصف التقني</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr>
                <td colspan="5" style="text-align: center; color: #94a3b8;">أدخل مفتاح الـ API وانقر على "توليد" لبدء إنشاء الأكواد.</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    let generatedData = [];

    async function generateTerms() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const category = document.getElementById('categorySelect').value;
        const btn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');

        if (!apiKey) {
            alert('يرجى إدخال مفتاح Gemini API أولاً.');
            return;
        }

        btn.disabled = true;
        loading.style.display = 'block';

        const domainText = category === 'الكل' ? 'مختلف مجالات تقنية المعلومات' : 'مجال ' + category;
        
        const promptText = `
أنت خبير في معاجم تقنية المعلومات. قم بتوليد 8 مصطلحات تقنية في ${domainText}.
لكل مصطلح أرجع JSON يحتوي على:
1. code: كود فريد يبدأ بـ IT_ (مثال: IT_SEC_001).
2. term_ar: الاسم بالعربية.
3. term_en: الاسم بالإنجليزي.
4. category: المجال الفرعي.
5. description: شرح مختصر باللغة العربية في سطر واحد.

أرجع النتيجة كـ JSON Array فقط وبدون أي نصوص إضافية.
        `;

        try {
            // تم تحديث اسم النموذج هنا إلى gemini-1.5-flash-latest
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            const data = await response.json();
            
            if (data.error) {
                throw new Error(data.error.message);
            }

            const jsonText = data.candidates[0].content.parts[0].text;
            generatedData = JSON.parse(jsonText);
            
            renderTable(generatedData);
        } catch (error) {
            alert('حدث خطأ أثناء التوليد: ' + error.message);
        } finally {
            btn.disabled = false;
            loading.style.display = 'none';
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">لا توجد نتائج.</td></tr>';
            return;
        }

        data.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><span class="code-badge">${item.code || ''}</span></td>
                <td><strong>${item.term_ar || ''}</strong></td>
                <td>${item.term_en || ''}</td>
                <td>${item.category || ''}</td>
                <td>${item.description || ''}</td>
            `;
            tbody.appendChild(row);
        });
    }

    function filterTable() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = generatedData.filter(item => 
            (item.code && item.code.toLowerCase().includes(query)) ||
            (item.term_ar && item.term_ar.toLowerCase().includes(query)) ||
            (item.term_en && item.term_en.toLowerCase().includes(query)) ||
            (item.category && item.category.toLowerCase().includes(query)) ||
            (item.description && item.description.toLowerCase().includes(query))
        );
        renderTable(filtered);
    }
</script>

</body>
</html>
